# NodePort service for external access
apiVersion: v1
kind: Service
metadata:
  name: ml-serving-nodeport
  namespace: ml-serving
  labels:
    app: ml-serving
    project: claude-ml-serving
spec:
  type: NodePort
  selector:
    app: ml-serving
  ports:
  - name: api
    port: 8000
    targetPort: 8000
    nodePort: 30086   # Access: http://localhost:30086
